[workspace]
resolver = "2"
members = ["crates/lizzard-abi", "crates/lizzard-ext", "crates/lizzard-syntax", "crates/lizzard-vm", "crates/lizzard-compiler", "crates/lizzard", "crates/lizzard-py-front", "crates/lizzard-jit", "crates/lizzard-py", "examples/embed_geom", "examples/geom_ext"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
debug = 1

# Cranelift compiles functions at runtime: optimize it even in debug builds,
# or compiling a module's functions takes most of a test run.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-bitset]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-control]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
