[package]
name = "slim-py"
version.workspace = true
edition.workspace = true

[lib]
name = "_slim"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
slim-py-front = { path = "../slim-py-front" }
pyo3 = { version = "0.29", features = ["extension-module"] }

[build-dependencies]
pyo3-build-config = "0.29"
